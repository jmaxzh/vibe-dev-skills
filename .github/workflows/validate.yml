name: Validate distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: python3 -B scripts/validate.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m unittest discover -s skills/cc-connect-integration/scripts -v
      - run: python3 -B scripts/smoke_install.py
      - run: python3 -B scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-dev-skills-review-package
          path: dist/
